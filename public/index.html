<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WhatsApp Forwarder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <header>
            <div class="brand">
                <div class="logo">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14" />
                        <path d="M13 6l6 6-6 6" />
                    </svg>
                </div>
                <h1>WhatsApp Forwarder</h1>
            </div>
            <div id="pill" class="pill" role="status"><i></i><span id="pillText">Starting…</span></div>
        </header>

        <div id="banner" class="banner" role="alert" hidden></div>

        <section id="destCard" class="card">
            <div>
                <div class="label">Forwarding to</div>
                <div id="destName" class="dest-name">—</div>
                <div id="destMeta" class="label"></div>
            </div>
            <button id="changeBtn" type="button" class="btn" disabled>Change</button>
        </section>

        <div id="mainView">
            <div class="tiles">
                <div class="tile"><b id="tQueued">0</b><span class="label">Queued</span></div>
                <div class="tile"><b id="tForwarded">0</b><span class="label">Forwarded</span></div>
                <div class="tile"><b id="tWaiting">0</b><span class="label">Waiting</span></div>
                <div id="tileFailed" class="tile"><b id="tFailed">0</b><span class="label">Failed</span></div>
            </div>
            <p id="meta" class="label"></p>
            <section class="activity">
                <div class="activity-head">
                    <h2>Recent activity</h2>
                    <button id="logsBtn" type="button" class="link">All logs</button>
                </div>
                <div id="activity"></div>
            </section>
        </div>

        <section id="qrView" class="center" hidden>
            <img id="qr" alt="WhatsApp QR code">
            <div>Scan with WhatsApp:<br>Linked devices, then Link a device.</div>
        </section>

        <section id="connectingView" class="center" hidden>
            <div>Connecting to WhatsApp…</div>
        </section>

        <footer>
            <button id="logout" type="button" class="danger" disabled>Log out</button>
            <span class="label">Updates every 3 seconds</span>
        </footer>
    </main>

    <dialog id="destDialog" aria-labelledby="destTitle">
        <form method="dialog">
            <h2 id="destTitle">Choose a destination</h2>
            <label for="groups" class="label">Groups of this WhatsApp account</label>
            <select id="groups" size="8"></select>
            <div class="actions">
                <button class="btn">Cancel</button>
                <button id="save" class="btn primary" type="button" disabled>Save</button>
            </div>
        </form>
    </dialog>

    <dialog id="logsDialog" aria-labelledby="logsTitle">
        <form method="dialog">
            <h2 id="logsTitle">Logs</h2>
            <label for="loglevel" class="label">Show (debug lines exist only when LOG_LEVEL=debug)</label>
            <select id="loglevel">
                <option value="info" selected>Info and above</option>
                <option value="warn">Warnings and errors</option>
                <option value="error">Errors only</option>
                <option value="debug">Everything (debug)</option>
            </select>
            <div id="logs" class="logs"></div>
            <div class="actions"><button class="btn">Close</button></div>
        </form>
    </dialog>
        
    <script src="script.js"></script>

</body>

</html>
